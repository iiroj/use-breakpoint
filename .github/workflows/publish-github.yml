name: Publish

on:
  push:
    tags:
      # Semver-like tags "v1.0.0"
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency: production_release

jobs:
  Install:
    uses: ./.github/workflows/_shared-install.yml

  Build:
    needs: Install
    uses: ./.github/workflows/_shared-build.yml
    with:
      artifact: true

  publish-github:
    name: Publish to GitHub Package Registry
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .node-version
      - uses: actions/download-artifact@v5
        with:
          name: use-breakpoint
      - run: tar xf use-breakpoint.tgz --strip 1
      - run: |-
          sed -i"" -E "s|\"name\": \".*\"|\"name\": \"@${GITHUB_REPOSITORY}\"|" package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com/
          package-manager-cache: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
